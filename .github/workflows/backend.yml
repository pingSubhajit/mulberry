name: Backend

# Typechecks and tests every backend change. Deploys stay with Fly's own GitHub integration, which
# deploys every push to main; this workflow reports problems, it doesn't gate the deploy.

on:
  pull_request:
    paths:
      - "apps/backend/**"
      - "Dockerfile"
      - "fly.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "Dockerfile"
      - "fly.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --filter @mulberry/backend --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.json
        working-directory: apps/backend
      - name: Test
        run: pnpm exec vitest run
        working-directory: apps/backend

