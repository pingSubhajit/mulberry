name: macOS Smoke

on:
  pull_request:
    paths:
      - "apps/macos/**"
      - "packages/apple/**"
      - ".github/workflows/macos-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "apps/macos/**"
      - "packages/apple/**"
      - ".github/workflows/macos-smoke.yml"

jobs:
  macos-smoke:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test shared ProductCore
        run: swift test
        working-directory: packages/apple
      - name: Run macOS smoke target
        run: ./Scripts/smoke-test.sh
        working-directory: apps/macos
      - name: Keep the canvas render that missed its golden
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-render
          path: apps/macos/Tests/Fixtures/canvas/rendered/preview-dry-brush.png
          if-no-files-found: ignore
